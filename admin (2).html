<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #09090b; --c: rgba(24, 24, 27, 0.8); --t: #fafafa; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        #denied { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; }
        .card { background: var(--c); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--p); color: #fff; border:none; padding: 12px; border-radius: 12px; font-weight:600; cursor:pointer; width:100%; }
        .user-item { display:flex; justify-content:space-between; align-items:center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        input, textarea { background: rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px; border-radius:10px; width:100%; margin-bottom:10px; }
    </style>
</head>
<body>
    <div id="denied"><h1>🔐 Kirish taqiqlandi</h1><p>Faqat Telegram orqali oching.</p></div>
    <div id="main" style="display:none;">
        <div class="card"><h1>Dashboard</h1><div class="stat-grid"><div class="card">User: <b id="total">0</b></div><div class="card">Blok: <b id="blocked">0</b></div></div></div>
        <div class="card"><h2>📢 Broadcast</h2><textarea id="msg" placeholder="Xabar..."></textarea><button class="btn" onclick="send()">Yuborish</button></div>
        <div class="card"><h2>👤 Userlar</h2><div id="list"></div></div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        const adminId = 8414409772;
        const api = new URLSearchParams(window.location.search).get('api') || 'bot.php';
        if (!tg.initDataUnsafe.user || tg.initDataUnsafe.user.id !== adminId) { document.getElementById('denied').style.display='flex'; } 
        else { document.getElementById('main').style.display='block'; tg.expand(); load(); }
        async function load() {
            const r = await fetch(`${api}?api=get_stats`); const d = await r.json();
            document.getElementById('total').innerText = d.total; document.getElementById('blocked').innerText = d.blocked;
            const l = document.getElementById('list'); l.innerHTML = '';
            d.list.forEach(u => {
                l.innerHTML += `<div class="user-item"><span>${u.name}</span><button onclick="block(${u.id})">${u.blocked?'Ochish':'Blok'}</button></div>`;
            });
        }
        async function block(id) { await fetch(`${api}?api=toggle_block`, {method:'POST', body:JSON.stringify({user_id:id})}); load(); }
        async function send() { const t = document.getElementById('msg').value; await fetch(`${api}?api=broadcast`, {method:'POST', body:JSON.stringify({text:t})}); alert('Yuborildi'); }
    </script>
</body>
</html>
